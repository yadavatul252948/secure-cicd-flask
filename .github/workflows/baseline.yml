name: C0 Baseline CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # START C0 MEASUREMENT
      # ==========================================
      - name: Start C0 Measurement
        run: |
          echo "C0 measurement started"
          date +%s.%N > /tmp/c0_pipeline_start

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          START=$(date +%s.%N)

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          END=$(date +%s.%N)

          echo "$START" > /tmp/c0_install_start
          echo "$END" > /tmp/c0_install_end

      # ==========================================
      # UNIT TESTS
      # ==========================================
      - name: Run Unit Tests
        run: |
          START=$(date +%s.%N)

          pytest

          END=$(date +%s.%N)

          echo "$START" > /tmp/c0_test_start
          echo "$END" > /tmp/c0_test_end

      # ==========================================
      # DOCKER BUILD
      # ==========================================
      - name: Build Docker Image
        run: |
          START=$(date +%s.%N)

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline .

          END=$(date +%s.%N)

          echo "$START" > /tmp/c0_docker_start
          echo "$END" > /tmp/c0_docker_end

      # ==========================================
      # GHCR LOGIN
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # PUSH DOCKER IMAGE
      # ==========================================
      - name: Push Docker Image
        run: |
          START=$(date +%s.%N)

          docker push \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

          END=$(date +%s.%N)

          echo "$START" > /tmp/c0_push_start
          echo "$END" > /tmp/c0_push_end

      # ==========================================
      # DEPLOY TO EC2
      # ==========================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker pull ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

            docker stop secure-cicd-flask || true
            docker rm secure-cicd-flask || true

            docker run -d \
              --name secure-cicd-flask \
              -p 5000:5000 \
              ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

      # ==========================================
      # END C0 MEASUREMENT
      # ==========================================
      - name: End C0 Measurement
        run: |
          date +%s.%N > /tmp/c0_pipeline_end

      # ==========================================
      # DISPLAY C0 MEASUREMENTS
      # ==========================================
      - name: Display C0 Baseline Measurements
        run: |
          python - <<'PY'
          import time

          def read(file):
              with open(file) as f:
                  return float(f.read().strip())

          install_time = read("/tmp/c0_install_end") - read("/tmp/c0_install_start")
          test_time = read("/tmp/c0_test_end") - read("/tmp/c0_test_start")
          docker_time = read("/tmp/c0_docker_end") - read("/tmp/c0_docker_start")
          push_time = read("/tmp/c0_push_end") - read("/tmp/c0_push_start")
          total_time = read("/tmp/c0_pipeline_end") - read("/tmp/c0_pipeline_start")

          print("")
          print("================================================")
          print("        C0 BASELINE CI/CD MEASUREMENTS")
          print("================================================")
          print(f"Install Dependencies : {install_time:.3f} seconds")
          print(f"Unit Tests           : {test_time:.3f} seconds")
          print(f"Docker Build         : {docker_time:.3f} seconds")
          print(f"GHCR Push            : {push_time:.3f} seconds")
          print(f"Total Pipeline Time  : {total_time:.3f} seconds")
          print("Status               : SUCCESS")
          print("================================================")
          print("")
          PY