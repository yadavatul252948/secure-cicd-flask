name: C0 Baseline CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # START TOTAL C0 MEASUREMENT
      # ==========================================
      - name: Start C0 Measurement
        run: |
          mkdir -p measurements
          date +%s.%N > measurements/pipeline_start

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          START=$(date +%s.%N)

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          END=$(date +%s.%N)

          echo "$START" > measurements/install_start
          echo "$END" > measurements/install_end

      # ==========================================
      # UNIT TESTS
      # ==========================================
      - name: Run Unit Tests
        run: |
          START=$(date +%s.%N)

          pytest

          END=$(date +%s.%N)

          echo "$START" > measurements/test_start
          echo "$END" > measurements/test_end

      # ==========================================
      # DOCKER BUILD
      # ==========================================
      - name: Build Docker Image
        run: |
          START=$(date +%s.%N)

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline .

          END=$(date +%s.%N)

          echo "$START" > measurements/docker_start
          echo "$END" > measurements/docker_end

      # ==========================================
      # GHCR LOGIN
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # PUSH IMAGE TO GHCR
      # ==========================================
      - name: Push Docker Image
        run: |
          START=$(date +%s.%N)

          docker push \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

          END=$(date +%s.%N)

          echo "$START" > measurements/push_start
          echo "$END" > measurements/push_end

      # ==========================================
      # DEPLOY TO EC2
      # ==========================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker pull ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

            docker stop secure-cicd-flask || true
            docker rm secure-cicd-flask || true

            docker run -d \
              --name secure-cicd-flask \
              -p 5000:5000 \
              ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

      # ==========================================
      # END TOTAL MEASUREMENT
      # ==========================================
      - name: End C0 Measurement
        run: |
          date +%s.%N > measurements/pipeline_end

      # ==========================================
      # CREATE C0 RESULTS
      # ==========================================
      - name: Calculate C0 Results
        run: |
          python - <<'PY'
          import json

          def read_time(file):
              with open(file) as f:
                  return float(f.read().strip())

          def calc(start, end):
              return round(
                  read_time(end) - read_time(start),
                  3
              )

          results = {
              "configuration": "C0",

              "install_time_seconds": calc(
                  "measurements/install_start",
                  "measurements/install_end"
              ),

              "unit_test_time_seconds": calc(
                  "measurements/test_start",
                  "measurements/test_end"
              ),

              "docker_build_time_seconds": calc(
                  "measurements/docker_start",
                  "measurements/docker_end"
              ),

              "ghcr_push_time_seconds": calc(
                  "measurements/push_start",
                  "measurements/push_end"
              ),

              "total_pipeline_time_seconds": calc(
                  "measurements/pipeline_start",
                  "measurements/pipeline_end"
              ),

              "status": "success"
          }

          with open("c0_results.json", "w") as f:
              json.dump(results, f, indent=2)

          print("")
          print("==========================================")
          print("        C0 BASELINE MEASUREMENT")
          print("==========================================")
          print(f"Install Dependencies : {results['install_time_seconds']} seconds")
          print(f"Unit Tests           : {results['unit_test_time_seconds']} seconds")
          print(f"Docker Build         : {results['docker_build_time_seconds']} seconds")
          print(f"GHCR Push            : {results['ghcr_push_time_seconds']} seconds")
          print("------------------------------------------")
          print(f"TOTAL PIPELINE       : {results['total_pipeline_time_seconds']} seconds")
          print(f"STATUS               : {results['status']}")
          print("==========================================")
          print("")

          print("JSON RESULT:")
          print(json.dumps(results, indent=2))
          PY

      # ==========================================
      # UPLOAD C0 RESULT
      # ==========================================
      - name: Upload C0 Measurement
        uses: actions/upload-artifact@v4
        with:
          name: C0-Baseline-Measurement
          path: c0_results.json