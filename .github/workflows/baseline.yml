name: C0 Baseline CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # C0 MEASUREMENT START
      # ==========================================
      - name: Start C0 Measurement
        run: |
          mkdir -p measurements
          date +%s.%N > measurements/pipeline_start

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          START=$(date +%s.%N)

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          END=$(date +%s.%N)

          echo "$START" > measurements/install_start
          echo "$END" > measurements/install_end

      # ==========================================
      # UNIT TESTS
      # ==========================================
      - name: Run Unit Tests
        run: |
          START=$(date +%s.%N)

          pytest

          END=$(date +%s.%N)

          echo "$START" > measurements/test_start
          echo "$END" > measurements/test_end

      # ==========================================
      # DOCKER BUILD
      # ==========================================
      - name: Build Docker Image
        run: |
          START=$(date +%s.%N)

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline .

          END=$(date +%s.%N)

          echo "$START" > measurements/docker_start
          echo "$END" > measurements/docker_end

      # ==========================================
      # GHCR LOGIN
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GHCR PUSH
      # ==========================================
      - name: Push Docker Image
        run: |
          START=$(date +%s.%N)

          docker push \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

          END=$(date +%s.%N)

          echo "$START" > measurements/push_start
          echo "$END" > measurements/push_end

      # ==========================================
      # EC2 DEPLOYMENT
      # ==========================================
      - name: Deploy to EC2
        run: |
          START=$(date +%s.%N)

          ssh -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/github-actions-cicd" \
              "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

          echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

          docker pull \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

          docker stop secure-cicd-flask || true
          docker rm secure-cicd-flask || true

          docker run -d \
            --name secure-cicd-flask \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-flask:baseline

          EOF

          END=$(date +%s.%N)

          echo "$START" > measurements/deploy_start
          echo "$END" > measurements/deploy_end

      # ==========================================
      # CREATE C0 RESULT
      # ==========================================
      - name: Create C0 Measurement Result
        run: |
          python - <<'PY'
          import json
          import time

          def read_time(filename):
              with open(filename) as f:
                  return float(f.read().strip())

          def duration(start, end):
              return round(read_time(start) - read_time(end), 3)

          pipeline_start = read_time("measurements/pipeline_start")
          pipeline_end = time.time()

          results = {
              "configuration": "C0",
              "install_time_seconds": round(
                  read_time("measurements/install_end")
                  - read_time("measurements/install_start"), 3
              ),
              "unit_test_time_seconds": round(
                  read_time("measurements/test_end")
                  - read_time("measurements/test_start"), 3
              ),
              "docker_build_time_seconds": round(
                  read_time("measurements/docker_end")
                  - read_time("measurements/docker_start"), 3
              ),
              "ghcr_push_time_seconds": round(
                  read_time("measurements/push_end")
                  - read_time("measurements/push_start"), 3
              ),
              "ec2_deployment_time_seconds": round(
                  read_time("measurements/deploy_end")
                  - read_time("measurements/deploy_start"), 3
              ),
              "total_pipeline_time_seconds": round(
                  pipeline_end - pipeline_start, 3
              ),
              "status": "success"
          }

          with open("c0_results.json", "w") as f:
              json.dump(results, f, indent=2)

          print("")
          print("==========================================")
          print("        C0 BASELINE MEASUREMENT")
          print("==========================================")
          print(f"Install Dependencies : {results['install_time_seconds']} seconds")
          print(f"Unit Tests           : {results['unit_test_time_seconds']} seconds")
          print(f"Docker Build         : {results['docker_build_time_seconds']} seconds")
          print(f"GHCR Push            : {results['ghcr_push_time_seconds']} seconds")
          print(f"EC2 Deployment       : {results['ec2_deployment_time_seconds']} seconds")
          print("------------------------------------------")
          print(f"TOTAL PIPELINE       : {results['total_pipeline_time_seconds']} seconds")
          print(f"STATUS               : {results['status']}")
          print("==========================================")
          print("")
          PY

      # ==========================================
      # SHOW C0 RESULT IN GITHUB ACTIONS
      # ==========================================
      - name: Display C0 Measurement
        run: |
          echo "=========================================="
          echo "           C0 BASELINE RESULT"
          echo "=========================================="
          cat c0_results.json
          echo "=========================================="

      # ==========================================
      # SAVE C0 RESULT AS ARTIFACT
      # ==========================================
      - name: Upload C0 Measurement
        uses: actions/upload-artifact@v4
        with:
          name: C0-Baseline-Measurement
          path: c0_results.json